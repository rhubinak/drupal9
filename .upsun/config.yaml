# Upsun configuration, generated using AI at: 2025-12-15T12:19:48+01:00
# AI can make mistakes. Please modify this file to suit your needs.
applications:
  drupal:
    type: php:8.1

    #dependencies:
    #  python3:
    #    weasyprint: '*'
    variables:
      env:
        # Update for your desired Python version.
        PYTHON_VERSION: "3.11.0"

    build:
      flavor: none

    hooks:
      build: |
        set -ex
        # Install PHP dependencies optimized for production.
        composer install --no-progress --no-interaction --optimize-autoloader --no-dev

        # Add Composer tools (such as drush) to the PATH.
        echo >> .environment 'export PATH="$PATH:$PLATFORM_APP_DIR/vendor/bin"'

        # Set the primary URL for Drush commands.
        echo >> .environment 'export PRIMARY_URL=$(echo "$PLATFORM_ROUTES" | base64 --decode | jq -r "to_entries[] | select(.value.primary) | .key")'
        echo >> .environment 'export DRUSH_OPTIONS_URI=${PRIMARY_URL%/}'

        # Ensure settings.php includes Upsun-specific configuration.
        if [ ! -f web/sites/default/settings.php ]; then
          cp web/sites/default/default.settings.php web/sites/default/settings.php
        fi
        if ! grep -q -F settings.upsun.php web/sites/default/settings.php; then
          echo >> web/sites/default/settings.php "// Upsun configuration"
          echo >> web/sites/default/settings.php "if (getenv('PLATFORM_APPLICATION') && file_exists(__DIR__ . '/settings.upsun.php')) {"
          echo >> web/sites/default/settings.php "  require_once __DIR__ . '/settings.upsun.php';"
          echo >> web/sites/default/settings.php "}"
        fi

        # Download Upsun Drupal settings if missing.
        if [ ! -f web/sites/default/settings.upsun.php ]; then
          curl -sfSL https://raw.githubusercontent.com/upsun/config-assets/refs/heads/main/drupal/11/settings.upsun.php > web/sites/default/settings.upsun.php
        fi

        # Clone Pyenv to the build cache if not present
        if [ ! -d "$PLATFORM_CACHE_DIR/.pyenv" ]; then
            mkdir -p $PLATFORM_CACHE_DIR/.pyenv
            git clone https://github.com/pyenv/pyenv.git $PLATFORM_CACHE_DIR/.pyenv
        fi

        # Pyenv environment variables
        export PYENV_ROOT="$PLATFORM_CACHE_DIR/.pyenv"
        export PATH="$PYENV_ROOT/bin:$PATH"

        # Initialize Pyenv
        if command -v pyenv 1>/dev/null 2>&1; then
            eval "$(pyenv init --path)"
        fi

        # Install desired Python version
        mkdir -p $PLATFORM_CACHE_DIR/.pyenv/versions
        if [ ! -d "$PLATFORM_CACHE_DIR/.pyenv/versions/$PYTHON_VERSION" ]; then
            pyenv install $PYTHON_VERSION
        fi

        # Set global Python version
        pyenv global $PYTHON_VERSION


        # Copy Pyenv directory to runtime directory
        #cp -R $PLATFORM_CACHE_DIR/.pyenv $PLATFORM_APP_DIR

        # Rehash Pyenv for new (runtime) location
        #PYENV_ROOT="$PLATFORM_APP_DIR/.pyenv" $PLATFORM_APP_DIR/.pyenv/bin/pyenv rehash

        python -m pip install weasyprint
        #pip3 install --user pillow weasyprint

      deploy: |
        set -ex
        cd web
        if [ -n "$(drush status --field=bootstrap)" ]; then
          drush -y cache-rebuild
          drush -y updatedb
          if [ -n "$(ls config/sync/*.yml 2>/dev/null)" ]; then
            drush -y config-import
          else
            echo "No config to import. Skipping."
          fi
        else
          echo "Drupal not installed. Skipping standard Drupal deploy steps"
        fi

    web:
      locations:
        /:
          root: web
          expires: 5m
          passthru: /index.php
          allow: false
          rules:
            '\.(avif|webp|jpe?g|png|gif|svgz?|css|js|map|ico|bmp|eot|woff2?|otf|ttf)$':
              allow: true
            '^/robots\.txt$':
              allow: true
            '^/sitemap\.xml$':
              allow: true
            '^/sites/sites\.php$':
              scripts: false
            '^/sites/[^/]+/settings.*?\.php$':
              scripts: false
        /sites/default/files:
          allow: true
          expires: 5m
          passthru: /index.php
          root: web/sites/default/files
          scripts: false
          rules:
            '^/sites/default/files/(css|js)':
              expires: 2w

    mounts:
      web/sites/default/files:
        source: storage
      tmp:
        source: storage
      private:
        source: storage
      .drush:
        source: storage
      drush-backups:
        source: storage

    relationships:
      db: {}
      cache: {}

    crons:
      drupal:
        spec: '*/19 * * * *'
        commands:
          start: 'cd web ; drush core-cron'

    runtime:
      extensions:
        - redis
        - sodium
        - apcu
        - blackfire
        - gd

services:
  db:
    type: mariadb:11.8
  cache:
    type: redis-persistent:8.0

routes:
  https://{default}/:
    type: upstream
    upstream: drupal:http
    cache:
      enabled: true
      cookies: ['/^SS?ESS/', '/^Drupal.visitor/']
  https://www.{default}/:
    type: redirect
    to: https://{default}/
